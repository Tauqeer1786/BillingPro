name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "artifacts/desktop-app/**"
      - "artifacts/api-server/**"
      - "artifacts/billing-app/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: |
          pnpm --filter local-ledger-pro-desktop run build
          pnpm --filter local-ledger-pro-desktop exec electron-builder --win nsis --x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Local-Ledger-Pro-Windows-Installer
          path: artifacts/desktop-app/release/*.exe
          if-no-files-found: error

      - name: Publish installer release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-desktop-latest
          name: Local Ledger Pro Windows Installer
          body: |
            Latest Windows installer built from `${{ github.sha }}`.

            Download the `.exe` from Assets below.
          files: artifacts/desktop-app/release/*.exe
          make_latest: true
          overwrite_files: true
